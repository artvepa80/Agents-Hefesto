name: Action Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      
      # Test Case A: Clean Scan (Expect Exit Code 0)
      - name: Test Action (Clean)
        id: clean_scan
        uses: ./
        with:
          target: '.github/action-smoke/clean.py'
          fail_on: 'CRITICAL'
          min_severity: 'LOW'
          format: 'text'
      
      - name: Verify Clean Scan Output
        if: always()
        run: |
          EXIT_CODE="${{ steps.clean_scan.outputs.exit_code }}"
          echo "Clean Scan Exit Code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Expected exit code 0 for clean file, got $EXIT_CODE"
            exit 1
          fi

      # Test Case B: Critical Secret (Expect Exit Code 1)
      - name: Test Action (Critical)
        id: critical_scan
        uses: ./
        with:
          target: '.github/action-smoke/critical_secret.py'
          fail_on: 'CRITICAL'
          min_severity: 'CRITICAL'
          format: 'json'
        # We expect failure, so we continue on error to verify the code
        continue-on-error: true

      - name: Verify Critical Scan Output
        if: always()
        run: |
          EXIT_CODE="${{ steps.critical_scan.outputs.exit_code }}"
          echo "Critical Scan Exit Code: $EXIT_CODE"
          # Hefesto CLI: 0=ok, 1=gate failure or error.
          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "::error::Critical scan must get exit code 1 (gate failure). Got $EXIT_CODE"
            exit 1
          fi
          echo "OK: exit code 1 (gate failure) as expected"

      # Test Case C: SARIF file written (no upload, so no security-events permission needed)
      - name: Test Action (SARIF)
        id: sarif_scan
        uses: ./
        with:
          target: '.github/action-smoke/critical_secret.py'
          fail_on: 'CRITICAL'
          min_severity: 'LOW'
          sarif: 'true'
          sarif_file: 'smoke.sarif'
          upload_sarif: 'false'
        continue-on-error: true

      - name: Verify SARIF Output
        if: always()
        run: |
          test "${{ steps.sarif_scan.outputs.sarif_file }}" = "smoke.sarif"
          python3 -c 'import json; log = json.load(open("smoke.sarif")); assert log["version"] == "2.1.0"; r = log["runs"][0]["results"]; assert any(x["level"] == "error" for x in r), r; print("OK:", len(r), "SARIF results")'

  # multilang: 'true' is opt-in. Not a required check: it downloads the
  # TypeScript grammar from the network on a cold runner.
  smoke-multilang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Default (multilang off): the .ts file is skipped (parser unavailable),
      # so no file is analyzed and the gate fails (exit 1), as in 4.20.x.
      - name: Test Action (TypeScript, multilang off)
        id: ts_off
        uses: ./
        with:
          target: '.github/action-smoke/clean.ts'
          fail_on: 'CRITICAL'
        continue-on-error: true

      - name: Test Action (TypeScript, multilang on)
        id: ts_on
        uses: ./
        with:
          target: '.github/action-smoke/clean.ts'
          fail_on: 'CRITICAL'
          multilang: 'true'
        continue-on-error: true

      - name: Verify multilang opt-in
        if: always()
        run: |
          echo "multilang off: exit ${{ steps.ts_off.outputs.exit_code }}; on: exit ${{ steps.ts_on.outputs.exit_code }}"
          test "${{ steps.ts_off.outputs.exit_code }}" = "1" || { echo "::error::multilang off must skip the .ts file (exit 1)"; exit 1; }
          test "${{ steps.ts_on.outputs.exit_code }}" = "0" || { echo "::error::multilang on must analyze the .ts file (exit 0)"; exit 1; }
