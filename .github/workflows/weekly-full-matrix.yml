name: Weekly full matrix

# Runs the lint-and-test steps from ci.yml on every supported Python
# (3.11 to 3.15) against main once a week. Pull requests and pushes test
# only 3.11 and 3.15; this catches breakage on 3.12-3.14 in between.
# Not a required check.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-full-matrix
  cancel-in-progress: false

jobs:
  lint-and-test-full:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lint]"

      - name: Guard (public repo boundary)
        run: python scripts/guard_public_repo.py

      - name: Mypy (blocking)
        run: python -m mypy hefesto --ignore-missing-imports

      - name: Black (check)
        run: python -m black --check hefesto tests

      - name: Isort (check)
        run: python -m isort --check-only hefesto tests

      - name: Flake8
        run: python -m flake8 hefesto tests

      - name: Check Docs Emails
        run: |
            if grep -rIn --exclude-dir=.git --exclude-dir=venv --exclude-dir=htmlcov --include="*.md" -E "[A-Za-z0-9._%+-]+@narapa\.ai" . ; then
              echo "❌ Found @narapa.ai emails."
              exit 1
            fi
            if grep -rIn --exclude-dir=.git --exclude-dir=venv --exclude-dir=htmlcov --include="*.md" "security@narapallc\.com" . ; then
              echo "❌ Found security@narapallc.com."
              exit 1
            fi
            # sales@narapallc.com is intentionally in README/docs as enterprise contact

      - name: Verify Capabilities Parity
        run: python scripts/verify_capabilities.py

      - name: Verify README Parity
        run: python scripts/verify_readme.py

      - name: Verify MCP server.json
        run: python scripts/verify_server_json.py

      - name: Pytest (unit)
        env:
          CI: true
          PYTHONPATH: .
          HEFESTO_TELEMETRY: "0"
        run: |
          python -m pytest -q --tb=short --maxfail=5 \
            -m "not integration and not slow" \
            --cov=hefesto --cov-report=xml --cov-report=term
