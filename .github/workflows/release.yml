name: Release (PyPI)

on:
  push:
    tags:
      - "v*"
      - "!v*rc*"
      - "!v*-rc.*"
      - "!v4" # floating alias of the 4.x line, moved by the last step below

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard (public repo boundary)
        run: |
          python -m pip install --upgrade pip
          python scripts/guard_public_repo.py

      - name: Verify release tag
        run: |
          python -m pip install "packaging>=23.0" "tomli>=2.0.1"
          python scripts/verify_release_tag.py --tag "${GITHUB_REF_NAME}" --project-root "${GITHUB_WORKSPACE}"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist + wheel
        run: |
          python -m build
          ls -la dist/

      - name: Twine check
        run: |
          python -m twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  # Trusted publishing (OIDC) to PyPI. id-token is set on this job only
  # so the build job cannot mint a PyPI identity. Attestations stay at
  # the action default (PEP 740). The action's default repository is PyPI.
  # https://docs.pypi.org/trusted-publishers/using-a-publisher/
  # https://github.com/pypa/gh-action-pypi-publish/blob/v1.14.2/README.md
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hefesto-ai
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  # GitHub Release and the floating v4 tag run only after publish succeeds.
  # contents: write is limited to this job. checkout stays on v5 so the v4
  # push keeps the persisted credentials that step already uses.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "Hefesto ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag

      # The GitHub Action is used as @v4: move that floating alias of the 4.x
      # line to this release. v4 is the only tag that ever moves (see
      # CLAUDE.md); a future v5 alias needs its own decision. Lightweight, like
      # actions/checkout's major tags. An older patch never moves v4 back.
      - name: Move floating v4 tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAJOR="v4"
          if [[ ! "$TAG" =~ ^v4\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a v4.x.y release; v4 not moved."
            exit 0
          fi
          LATEST=$(git ls-remote --tags --refs origin "refs/tags/${MAJOR}.*" \
            | sed 's#.*refs/tags/##' | grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)
          if [ "$LATEST" != "$TAG" ]; then
            echo "::notice::$TAG is not the newest ${MAJOR}.x.y ($LATEST); $MAJOR not moved."
            exit 0
          fi
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/${MAJOR}"
          echo "::notice::$MAJOR now points to $TAG ($GITHUB_SHA)."
