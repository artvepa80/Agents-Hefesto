name: Release (PyPI)

on:
  push:
    tags:
      - "v*"
      - "!v*rc*"
      - "!v*-rc.*"
      - "!v4" # floating alias of the 4.x line, moved by the last step below

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard (public repo boundary)
        run: |
          python -m pip install --upgrade pip
          python scripts/guard_public_repo.py

      - name: Verify release tag
        run: |
          python -m pip install "packaging>=23.0" "tomli>=2.0.1"
          python scripts/verify_release_tag.py --tag "${GITHUB_REF_NAME}" --project-root "${GITHUB_WORKSPACE}"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist + wheel
        run: |
          python -m build
          ls -la dist/

      - name: Twine check
        run: |
          python -m twine check dist/*

      # A real upload error fails this step and the job. --skip-existing
      # ignores only files already on PyPI, so a re-run of the same tag can
      # still reach the release and the v4 move. Those steps use success().
      - name: Publish to PyPI
        id: pypi
        if: ${{ env.TWINE_PASSWORD != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --skip-existing dist/*

      # Only the success and skipped outcomes are visible here. A failed upload
      # fails the job, so this step (if: success()) does not run to report it.
      - name: PyPI publish status
        if: success()
        run: |
          if [ "${{ steps.pypi.outcome }}" = "success" ]; then
            echo "::notice::PyPI publish succeeded."
          elif [ "${{ steps.pypi.outcome }}" = "skipped" ]; then
            echo "::warning::PyPI publish skipped (no PYPI_API_TOKEN)."
          fi

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "Hefesto ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag

      # The GitHub Action is used as @v4: move that floating alias of the 4.x
      # line to this release. v4 is the only tag that ever moves (see
      # CLAUDE.md); a future v5 alias needs its own decision. Lightweight, like
      # actions/checkout's major tags. An older patch never moves v4 back.
      - name: Move floating v4 tag
        if: success()
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAJOR="v4"
          if [[ ! "$TAG" =~ ^v4\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a v4.x.y release; v4 not moved."
            exit 0
          fi
          LATEST=$(git ls-remote --tags --refs origin "refs/tags/${MAJOR}.*" \
            | sed 's#.*refs/tags/##' | grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)
          if [ "$LATEST" != "$TAG" ]; then
            echo "::notice::$TAG is not the newest ${MAJOR}.x.y ($LATEST); $MAJOR not moved."
            exit 0
          fi
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/${MAJOR}"
          echo "::notice::$MAJOR now points to $TAG ($GITHUB_SHA)."
