# Changed-file gate: ruff, then Hefesto on the files this event changed.
#
# pull_request: diff against the base commit. push to main: diff against
# github.event.before (an all-zero before compares to an empty tree).
#
# The log prints each command before running it. That log is the dogfood
# evidence. --allow-no-files keeps a diff with no analyzable files at exit 0
# (hefesto analyze with --fail-on exits 1 when it analyzed nothing; PATHS is
# still required, so an empty diff does not invoke analyze).
#
# Ruff gets --force-exclude, so [tool.ruff] extend-exclude (scripts/,
# examples/) applies to the changed files too. Changed files matching exclude
# in .hefesto.yaml are not gated; the script filters them itself, because
# hefesto analyze does not apply exclude to explicit paths. Without the file
# it falls back to tests/fixtures/ and .github/action-smoke/ (planted findings).
#
# With those exclusions, one tracked file fails the gate when touched:
# scripts/validate_aggregates_jsonl.py:48 (CRITICAL VERY_HIGH_COMPLEXITY,
# until that function is split). The PostHog public project key in
# hefesto/telemetry/client.py is reported as LOW (known public client key).
# The self-check step proves a planted AKIA key fails and that hefesto/ has
# no CRITICAL findings.

name: Dogfood

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # "edited" re-runs the gate when a suppression approval line is added to
    # the pull request body.
    types: [ opened, synchronize, reopened, edited ]

permissions:
  contents: read

concurrency:
  group: dogfood-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main keeps its own run so
  # each before..sha range is gated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dogfood-hefesto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lint]"

      - name: Ruff and Hefesto on changed files
        env:
          HEFESTO_TELEMETRY: "0"
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # New line suppressions fail pull requests unless the PR body has an
          # approval line per file:line (read from GITHUB_EVENT_PATH). Pushes
          # to main only list them: the push payload has no PR body.
          FLAGS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            FLAGS+=(--fail-on-new-suppressions)
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          echo "event=${EVENT_NAME} base=${BASE} head=${HEAD_SHA}"
          python scripts/dogfood_changed.py --base "$BASE" --head "$HEAD_SHA" "${FLAGS[@]}"

      - name: Self-check the gate
        if: ${{ !cancelled() }}
        env:
          HEFESTO_TELEMETRY: "0"
        run: python scripts/dogfood_changed.py --self-check
