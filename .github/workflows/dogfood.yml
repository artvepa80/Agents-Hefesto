# Changed-file gate: ruff, then Hefesto on the files this event changed.
#
# pull_request: diff against the base commit. push to main: diff against
# github.event.before (an all-zero before compares to an empty tree).
#
# The log prints each command before running it. That log is the dogfood
# evidence. --allow-no-files keeps a diff with no analyzable files at exit 0
# (hefesto analyze with --fail-on exits 1 when it analyzed nothing; PATHS is
# still required, so an empty diff does not invoke analyze).
#
# Ruff gets --force-exclude, so [tool.ruff] extend-exclude (scripts/,
# examples/) applies to the changed files too. Files under tests/fixtures/ and
# .github/action-smoke/ carry planted findings on purpose and are not gated.
#
# With those exclusions, two tracked files fail the gate when touched:
# scripts/validate_aggregates_jsonl.py:48 (CRITICAL VERY_HIGH_COMPLEXITY,
# until that function is split) and hefesto/telemetry/client.py: line 28 is a
# PostHog public write-only project key (docs/telemetry.md), reported as
# CRITICAL HARDCODED_SECRET.
# No line-level suppression exists, and this job does not drop HARDCODED_SECRET.
# A pull request that touches that file fails until a line-level suppression
# is designed.
# The self-check step proves a planted AKIA key fails and that the rest of
# hefesto/ passes.

name: Dogfood

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dogfood-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main keeps its own run so
  # each before..sha range is gated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dogfood-hefesto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lint]"

      - name: Ruff and Hefesto on changed files
        env:
          HEFESTO_TELEMETRY: "0"
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          echo "event=${EVENT_NAME} base=${BASE} head=${HEAD_SHA}"
          python scripts/dogfood_changed.py --base "$BASE" --head "$HEAD_SHA"

      - name: Self-check the gate
        if: ${{ !cancelled() }}
        env:
          HEFESTO_TELEMETRY: "0"
        run: python scripts/dogfood_changed.py --self-check
