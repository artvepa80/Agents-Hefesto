# Changed-file gate: ruff, then Hefesto on the files this event changed.
#
# pull_request: diff against the base commit. push to main: diff against
# github.event.before (an all-zero before compares to an empty tree).
#
# The log prints each command before running it. That log is the dogfood
# evidence. --allow-no-files keeps a diff with no analyzable files at exit 0
# (hefesto analyze with --fail-on exits 1 when it analyzed nothing; PATHS is
# still required, so an empty diff does not invoke analyze).
#
# hefesto/telemetry/client.py line 28 is a PostHog public write-only project
# key (docs/telemetry.md) and is reported as CRITICAL HARDCODED_SECRET.
# No line-level suppression exists, and this job does not drop HARDCODED_SECRET.
# A pull request that touches that file fails until a suppression is designed.
# The self-check step proves a planted AKIA key fails and that the rest of
# hefesto/ passes.

name: Dogfood

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood-hefesto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lint]"

      - name: Ruff and Hefesto on changed files
        env:
          HEFESTO_TELEMETRY: "0"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "event=${{ github.event_name }} base=${BASE} head=${{ github.sha }}"
          python scripts/dogfood_changed.py --base "$BASE" --head "${{ github.sha }}"

      - name: Self-check the gate
        if: ${{ !cancelled() }}
        env:
          HEFESTO_TELEMETRY: "0"
        run: python scripts/dogfood_changed.py --self-check
