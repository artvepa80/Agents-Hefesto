name: Release (TestPyPI)

on:
  push:
    tags:
      - "v*rc*"
      - "v*-rc.*"

permissions:
  contents: read

concurrency:
  group: release-testpypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify release tag
        run: |
          python -m pip install --upgrade pip
          python -m pip install "packaging>=23.0" "tomli>=2.0.1"
          python scripts/verify_release_tag.py --tag "${GITHUB_REF_NAME}" --project-root "${GITHUB_WORKSPACE}"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist + wheel
        run: |
          python -m build
          ls -la dist/

      - name: Twine check
        run: |
          python -m twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  # Trusted publishing (OIDC) to TestPyPI. id-token is set on this job only
  # so the build job cannot mint a TestPyPI identity. Attestations stay at
  # the action default (PEP 740).
  # https://docs.pypi.org/trusted-publishers/using-a-publisher/
  # https://github.com/pypa/gh-action-pypi-publish/blob/v1.14.2/README.md
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hefesto-ai
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
